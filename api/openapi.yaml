openapi: "3.0.3"
info:
  title: Oblak
  version: "1.0.0"

paths:
  /health:
    get:
      operationId: GetHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /upload-lambda:
    post:
      operationId: UploadLambda
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - function
              properties:
                function:
                  type: string
                  format: binary
                  description: The function archive file (tar.gz, tar.xz, or zip)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
  /list-functions:
    get:
      summary: Get all functions for the authenticated user
      operationId: GetUserFunctions
      responses:
        "200":
          description: A list of functions and related entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionEntity'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
  /functions/{function_id}/invocations:
    get:
      summary: Get invocation history for a specific function ordered from newest to oldest
      operationId: GetFunctionInvocations
      parameters:
        - name: function_id
          in: path
          required: true
          description: The UUID of the function
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of invocations ordered chronologically descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvocationResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /invocations/{invocation_id}:
    get:
      summary: Get a specific invocation detail including its logs
      operationId: GetInvocationDetails
      parameters:
        - name: invocation_id
          in: path
          required: true
          description: The UUID of the specific invocation run
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invocation details with execution logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleInvocationDetailsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
  /execute/{functionId}:
    post:
      operationId: ExecuteLambda
      parameters:
        - name: functionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'

components:
  schemas:
    InvocationResponse:
      type: object
      required: [ invocation_id, status, invocation_time ]
      properties:
        invocation_id:
          type: string
          format: uuid
          example: "d3b07384-d113-49cd-a5d6-83d6e0743b51"
        status:
          type: string
          example: "COMPLETED"
        invocation_time:
          type: string
          format: date-time
          example: "2026-05-30T13:45:00Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-05-30T13:45:02Z"

    SingleInvocationDetailsResponse:
      type: object
      required: [ invocation_id, status, invocation_time, logs ]
      properties:
        invocation_id:
          type: string
          format: uuid
          example: "d3b07384-d113-49cd-a5d6-83d6e0743b51"
        status:
          type: string
          example: "COMPLETED"
        invocation_time:
          type: string
          format: date-time
          example: "2026-05-30T13:45:00Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-05-30T13:45:02Z"
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogLine'

    LogLine:
      type: object
      required: [ timestamp, message, stream ]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-05-30T13:45:00.123Z"
        stream:
          type: string
          enum: [stdout, stderr]
          example: "stdout"
        message:
          type: string
          example: "Error connecting to Redis instance, retrying..."

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    FunctionEntity:
      type: object
      required: [ id, name, status, created_at ]
      properties:
        id:
          type: string
          example: "fn_98234"
        last_execution:
          type: string
          format: date-time
          example: "2026-10-05T20:24:00Z"
        status:
          type: string
          example: "READY"
    UploadResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
    ExecuteResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'