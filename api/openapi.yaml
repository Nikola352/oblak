openapi: "3.0.3"
info:
  title: Oblak
  version: "1.0.0"

paths:
  /health:
    get:
      operationId: GetHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /upload-lambda:
    post:
      operationId: UploadLambda
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - function
              properties:
                function:
                  type: string
                  format: binary
                  description: The function archive file (tar.gz, tar.xz, or zip)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
  /list-functions:
    get:
      summary: Get all functions for the authenticated user
      operationId: GetUserFunctions
      responses:
        "200":
          description: A list of functions and related entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionEntity'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    FunctionEntity:
      type: object
      required: [ id, name, status, created_at ]
      properties:
        id:
          type: string
          example: "fn_98234"

        status:
          type: string
          example: "READY"

    UploadResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
