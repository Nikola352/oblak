services:
  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oblak
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  fs:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Forces the browser to stay on localhost when redirecting
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio-data:/data
    # Added --address ":9000" to be explicit
    command: server /data --address ":9000" --console-address ":9001"
  mq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # RabbitMQ protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  clamav:

    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "3310:3310" # Expose for your Go app
    environment:
        # These environment variables tell the official ClamAV image to enable TCP
        - TCPSocket=3310
        - TCPAddr=0.0.0.0
  python_sandbox:
    image: python:3.11-alpine
    container_name: gvisor_python_sandbox
    # This replaces the --runtime=runsc flag completely!
    runtime: runsc
    profiles:
      - tools-pull-only
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uses ollama's own binary to verify server status, avoiding missing binary issues
    entrypoint: >
      /bin/sh -c "
      ollama serve & 
      echo '[INIT] Waiting for Ollama engine to spin up...';
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      echo '[INIT] Server ready! Pulling qwen2.5:3b...';
      ollama pull qwen2.5:3b; 
      echo '[INIT] Initialization complete!';
      wait"
volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  ollama_data: